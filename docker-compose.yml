# Nexus — docker-compose（依 .claude/CLAUDE.infra.md）
# 網路隔離：npm ↔ app（frontend）、app ↔ db（backend）、db 只在 backend

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器內走 compose 網路，覆寫 .env 的 localhost
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      # 保密資料目錄，對應下方 bind mount（TASK-004）
      LOCALDATA_DIR: /app/localdata
    volumes:
      # 保密資料持久化：宿主 ./localdata ↔ 容器 /app/localdata（TASK-004）
      - ./localdata:/app/localdata
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
    # healthcheck 由 Dockerfile 提供（compose 不重複覆寫）

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    # 僅本機 loopback 供開發（prisma migrate dev 等）；5432 已被其他容器佔用故用 5434。
    # db 不暴露到 public network（infra.md）
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 同義詞字典（TASK-006；alpine 的 sharedir 是 /usr/local/share/postgresql）
      # .ths：thesaurus template 實際使用；.syn：legacy，migration 1 重播用（內容需同步）
      - ./infra/pg-tsearch/nexus_syn.ths:/usr/local/share/postgresql/tsearch_data/nexus_syn.ths:ro
      - ./infra/pg-tsearch/nexus_syn.syn:/usr/local/share/postgresql/tsearch_data/nexus_syn.syn:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm-data:/data
      - letsencrypt:/etc/letsencrypt
    networks:
      - frontend

networks:
  frontend: {}
  backend: {}

volumes:
  postgres-data:
  npm-data:
  letsencrypt:
